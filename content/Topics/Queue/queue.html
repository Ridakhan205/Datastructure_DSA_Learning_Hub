<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Queue Visualization</title>
    <link rel="stylesheet" href="queue.css">
</head>

<body>
    <a href="/content/index.html">
        <button class="back-nav-btn">
            <div class="button-box">
                <span class="button-elem">
                    <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z">
                        </path>
                    </svg>
                </span>
                <span class="button-elem">
                    <svg viewBox="0 0 46 40">
                        <path
                            d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z">
                        </path>
                    </svg>
                </span>
            </div>
        </button>
    </a>
    <nav class="navbar">
        <div class="nav-right">
            <button class="nav-btn" id="linearBtn">Linear Queue</button>
            <button class="nav-btn" id="circularBtn">Circular Queue</button>
            <button class="nav-btn" id="videoBtn">Videos</button>
        </div>
    </nav>

    <section class="array-container">
        <div class="array">
            <div class="array-box">0</div>
            <div class="array-box">1</div>
            <div class="array-box">2</div>
            <div class="array-box">3</div>
            <div class="array-box">4</div>
            <div class="array-box">5</div>
            <div class="array-box">6</div>
            <div class="array-box">7</div>
            <div class="array-box">8</div>
            <div class="array-box">9</div>
        </div>
    </section>

    <div class="controls" id="queueControls">
        <button class="control-btn" id="enqueueBtn">Enqueue</button>
        <button class="control-btn" id="dequeueBtn">Dequeue</button>
    </div>

    <section class="content">
        <div class="box dry-run">
            <h3>Dry Run</h3>
            <div id="dryRun"></div>
        </div>

        <div class="box visualization">
            <h3>Visualization</h3>
            <div class="bucket" id="visualBucket">
                <div class="bucket-wall"></div>
                <div class="queue" id="queue"></div>
                <div class="bucket-wall"></div>
            </div>
        </div>
    </section>

    <!-- ================= VIDEO MODAL ================= -->
    <div class="video-overlay" id="videoOverlay">
        <div class="video-modal">

            <!-- HEADER + CLOSE BUTTON -->
            <div class="video-modal-header">
                <h2>Queue Video Tutorials</h2>
                <button class="close-video" id="closeVideo">✖</button>
            </div>

            <!-- SCROLLABLE CONTENT -->
            <div class="video-modal-content">
                <div class="video-item" data-video="v1.mp4">
                    <h4>Queue Insertion</h4>
                    <p>Step-by-step enqueue operation</p>
                </div>

                <div class="video-item" data-video="queue_deletion.mp4">
                    <h4>Queue Deletion</h4>
                    <p>Step-by-step dequeue operation</p>
                </div>

                <div class="video-item" data-video="queue_traversal.mp4">
                    <h4>Queue Traversal</h4>
                    <p>How to traverse the queue</p>
                </div>

                <!-- VIDEO PLAYER -->
                <video id="mainVideo" controls>
                    <source src="" type="video/mp4">
                </video>
            </div>

        </div>
    </div>

    <script src="queue.js"></script>
</body>

</html>
