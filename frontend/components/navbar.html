<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="hero-nav">
        <div class="logo">DSA Learning Hub</div>
        <nav class="navbar">
            <a href="../content/index.html">Learn</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <!-- Sign Up Button -->
            <div class="voltage-button signup">
                <!-- THE SIGN UP HAS A FLAW WHICH IS A LINE BELOW IT, REMOVE IT!! -->
                <button><a class="signup-link" href="/login">Sign up</a></button>
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" viewBox="0 0 234.6 61.3"
                    preserveAspectRatio="none" xml:space="preserve">
                    <filter id="glow">
                        <feGaussianBlur class="blur" result="coloredBlur" stdDeviation="2"></feGaussianBlur>
                        <feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="0.3" result="turbulence">
                        </feTurbulence>
                        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="30" xChannelSelector="R"
                            yChannelSelector="G" result="displace"></feDisplacementMap>
                        <feMerge>
                            <feMergeNode in="coloredBlur"></feMergeNode>
                            <feMergeNode in="coloredBlur"></feMergeNode>
                            <feMergeNode in="coloredBlur"></feMergeNode>
                            <feMergeNode in="displace"></feMergeNode>
                            <feMergeNode in="SourceGraphic"></feMergeNode>
                        </feMerge>
                    </filter>
                    <path class="voltage line-1" d="M..." fill="transparent" stroke="#fff"></path>
                    <path class="voltage line-2" d="M..." fill="transparent" stroke="#fff"></path>
                </svg>
                <div class="dots">
                    <div class="dot dot-1"></div>
                    <div class="dot dot-2"></div>
                    <div class="dot dot-3"></div>
                    <div class="dot dot-4"></div>
                    <div class="dot dot-5"></div>
                </div>
            </div>
        </nav>
    </div>
</body>

</html>
